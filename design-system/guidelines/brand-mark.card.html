<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--white); color:var(--text-strong); }
  .wrap { padding:22px 28px; display:flex; gap:30px; align-items:center; }
  .col { display:flex; flex-direction:column; align-items:center; gap:10px; }
  img { width:64px; height:64px; }
  .n { font-size:11px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><img src="../assets/logos/inplux-mark-teal.svg" alt="mark"><div class="n">Estratos · primary</div></div>
    <div class="col"><img src="../assets/logos/inplux-mark-ink.svg" alt="mark ink"><div class="n">Mono · ink</div></div>
    <div class="col"><img src="../assets/logos/inplux-mark-flux-teal.svg" alt="two-tone"><div class="n">Two-tone teal</div></div>
    <div class="col"><img src="../assets/logos/inplux-appicon.svg" alt="app icon"><div class="n">App icon</div></div>
    <div class="col" style="margin-left:8px"><div style="font-family:var(--font-body);font-weight:700;letter-spacing:var(--tracking-wordmark);font-size:24px">INPLUX</div><div class="n">Wordmark · tracked</div></div>
  </div>
</body>
</html>
