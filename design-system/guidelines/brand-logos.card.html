<!-- @dsCard group="Brand" viewport="700x180" name="Logo lockups" subtitle="Horizontal & stacked · positive / inverse" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--white); }
  .wrap { padding:0; display:grid; grid-template-columns:1fr 1fr; height:100%; }
  .cell { display:flex; align-items:center; justify-content:center; padding:24px; }
  .light { background:var(--off-white); }
  .dark { background:var(--ink); position:relative; overflow:hidden; }
  .dark::before { content:""; position:absolute; inset:0; background:var(--glow-teal); }
  img { max-width:200px; max-height:80px; position:relative; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cell light"><img src="../assets/logos/inplux-logo-horizontal.svg" alt="INPLUX horizontal"></div>
    <div class="cell dark"><img src="../assets/logos/inplux-logo-stacked-inverse.svg" alt="INPLUX stacked inverse"></div>
  </div>
</body>
</html>
