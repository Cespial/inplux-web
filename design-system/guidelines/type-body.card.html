<!-- @dsCard group="Type" viewport="700x230" name="Body — Plus Jakarta Sans" subtitle="300–800 · UI, paragraphs, labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--white); color:var(--text-strong); }
  .wrap { padding:24px 28px; }
  .lead { font-size:var(--fs-lead); color:var(--text-body); margin:0 0 14px; max-width:46ch; line-height:var(--leading-snug); }
  .weights { display:flex; gap:18px; flex-wrap:wrap; align-items:baseline; }
  .weights span { font-size:20px; }
  .cap { font-size:10px; color:var(--text-muted); display:block; margin-top:2px; font-weight:400; letter-spacing:0; }
  .w300{font-weight:300}.w400{font-weight:400}.w500{font-weight:500}.w600{font-weight:600}.w700{font-weight:700}.w800{font-weight:800}
</style>
</head>
<body>
  <div class="wrap">
    <p class="lead">El conocimiento de 25 años en gestión tributaria, convertido en agentes de IA que se mejoran solos.</p>
    <div class="weights">
      <span class="w300">Aa<span class="cap">300 Light</span></span>
      <span class="w400">Aa<span class="cap">400 Regular</span></span>
      <span class="w500">Aa<span class="cap">500 Medium</span></span>
      <span class="w600">Aa<span class="cap">600 Semibold</span></span>
      <span class="w700">Aa<span class="cap">700 Bold</span></span>
      <span class="w800">Aa<span class="cap">800 Extrabold</span></span>
    </div>
  </div>
</body>
</html>
