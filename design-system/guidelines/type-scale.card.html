<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--white); color:var(--text-strong); }
  .wrap { padding:20px 28px; display:flex; flex-direction:column; gap:6px; }
  .line { display:flex; align-items:baseline; gap:16px; border-bottom:1px solid var(--border-light); padding-bottom:5px; }
  .line .spec { width:130px; flex:none; font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; }
  .serif { font-family:var(--font-serif); font-weight:400; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line"><span class="spec">Display · 80</span><span class="serif" style="font-size:40px;line-height:1">Construimos</span></div>
    <div class="line"><span class="spec">H2 · 44</span><span class="serif" style="font-size:30px;line-height:1">Ecosistema</span></div>
    <div class="line"><span class="spec">Lead · 20</span><span style="font-size:20px;color:var(--text-body)">Inteligencia tributaria que aprende</span></div>
    <div class="line"><span class="spec">Body · 16</span><span style="font-size:16px;color:var(--text-body)">Entregamos productos, no horas.</span></div>
    <div class="line"><span class="spec">Label · 11</span><span style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;color:var(--text-muted)">Cerebro legal</span></div>
  </div>
</body>
</html>
