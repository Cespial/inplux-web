<!-- @dsCard group="Type" viewport="700x180" name="Labels & eyebrows" subtitle="Uppercase · tracking 0.08em · middot separators" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--white); color:var(--text-strong); }
  .wrap { padding:24px 28px; display:flex; flex-direction:column; gap:18px; }
  .eyebrow { font-size:var(--fs-label); text-transform:uppercase; letter-spacing:var(--tracking-label); font-weight:600; color:var(--text-muted); }
  .eyebrow b { color:var(--teal); font-weight:600; }
  .wordmark { font-size:18px; font-weight:700; letter-spacing:var(--tracking-wordmark); color:var(--ink); }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .tag { font-size:11px; text-transform:uppercase; letter-spacing:var(--tracking-label); font-weight:600; padding:4px 10px; border:1px solid var(--border); border-radius:var(--radius-pill); color:var(--text-body); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Agentes de IA · Cerebro legal · Fábrica de software</div>
    <div class="wordmark">INPLUX</div>
    <div class="row">
      <span class="tag">Producto · Tribai.co</span>
      <span class="tag">NIC/NIIF</span>
      <span class="tag">Estatuto vivo</span>
    </div>
  </div>
</body>
</html>
