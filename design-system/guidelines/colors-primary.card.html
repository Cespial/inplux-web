<!-- @dsCard group="Colors" viewport="700x150" name="Brand primaries" subtitle="Ink, teal accent, warm whites" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--white); color:var(--text-strong); }
  .wrap { padding:20px 24px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .sw { width:120px; }
  .chip { height:64px; border-radius:var(--radius-md); border:1px solid var(--border); }
  .name { font-size:12px; font-weight:600; margin-top:8px; }
  .hex { font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums; letter-spacing:0.02em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="name">Ink</div><div class="hex">#1a1918</div></div>
      <div class="sw"><div class="chip" style="background:var(--teal)"></div><div class="name">Teal · accent</div><div class="hex">#0d7d74</div></div>
      <div class="sw"><div class="chip" style="background:var(--teal-bright)"></div><div class="name">Teal bright</div><div class="hex">#15dcc4</div></div>
      <div class="sw"><div class="chip" style="background:var(--teal-soft)"></div><div class="name">Teal soft</div><div class="hex">#e8f5f3</div></div>
      <div class="sw"><div class="chip" style="background:var(--off-white)"></div><div class="name">Off-white</div><div class="hex">#f8f8f7</div></div>
      <div class="sw"><div class="chip" style="background:var(--white)"></div><div class="name">White</div><div class="hex">#ffffff</div></div>
    </div>
  </div>
</body>
</html>
