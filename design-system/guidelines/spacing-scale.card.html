<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="8px base rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--white); color:var(--text-strong); }
  .wrap { padding:22px 28px; display:flex; gap:14px; align-items:flex-end; }
  .col { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar { background:var(--teal-soft); border:1px solid var(--teal); border-radius:var(--radius-xs); width:28px; }
  .v { font-size:10px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .n { font-size:10px; font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="bar" style="height:8px"></div><div class="n">2</div><div class="v">8</div></div>
    <div class="col"><div class="bar" style="height:12px"></div><div class="n">3</div><div class="v">12</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="n">4</div><div class="v">16</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="n">5</div><div class="v">24</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="n">6</div><div class="v">32</div></div>
    <div class="col"><div class="bar" style="height:40px"></div><div class="n">7</div><div class="v">40</div></div>
    <div class="col"><div class="bar" style="height:48px"></div><div class="n">8</div><div class="v">48</div></div>
    <div class="col"><div class="bar" style="height:64px"></div><div class="n">9</div><div class="v">64</div></div>
    <div class="col"><div class="bar" style="height:80px"></div><div class="n">10</div><div class="v">80</div></div>
  </div>
</body>
</html>
