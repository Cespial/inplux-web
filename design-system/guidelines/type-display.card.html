<!-- @dsCard group="Type" viewport="700x200" name="Display — Instrument Serif" subtitle="Headlines only · one word in italic teal" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--white); color:var(--text-strong); }
  .wrap { padding:24px 28px; }
  .eyebrow { font-size:var(--fs-label); text-transform:uppercase; letter-spacing:var(--tracking-label); color:var(--text-muted); font-weight:600; margin-bottom:14px; }
  h1 { font-family:var(--font-serif); font-weight:400; font-size:54px; line-height:var(--leading-display); letter-spacing:var(--tracking-display); margin:0; }
  h1 em { font-style:italic; color:var(--teal); }
  .note { margin-top:14px; font-size:12px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Display · Instrument Serif · 400</div>
    <h1>Tributaristas que construyen <em>tecnología.</em></h1>
    <div class="note">Normal + Italic · tracking −0.02em · line-height 1.02</div>
  </div>
</body>
</html>
