<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--white); color:var(--text-strong); }
  #root { padding:26px 28px; }
  .group { margin-bottom:24px; }
  .gl { font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); font-weight:600; margin-bottom:12px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Badge, Pill, Stat, Card, Input, Field, Eyebrow } = window.INPLUXDesignSystem_318bee;
    function Demo() {
      return (
        <div>
          <div className="group">
            <div className="gl">Button</div>
            <div className="row">
              <Button variant="primary">Hablemos</Button>
              <Button variant="secondary">Ver productos</Button>
              <Button variant="teal">Probar Tribai</Button>
              <Button variant="ghost">Saber más</Button>
              <Button variant="primary" disabled>Disabled</Button>
              <Button variant="secondary" size="sm">Small</Button>
              <Button variant="primary" size="lg">Large</Button>
            </div>
          </div>
          <div className="group">
            <div className="gl">Badge &amp; Pill</div>
            <div className="row">
              <Badge variant="soft">IA tributaria</Badge>
              <Badge variant="outline" uppercase>NIC/NIIF</Badge>
              <Badge variant="ink">Estrella</Badge>
              <Badge variant="teal">Nuevo</Badge>
              <Pill figure="+25" label="años" />
              <Pill figure="+50" label="municipios" />
              <Pill figure="+100" label="proyectos" />
            </div>
          </div>
          <div className="group">
            <div className="gl">Stat</div>
            <div className="row" style={{ gap: "44px" }}>
              <Stat value="+25" label="Años" />
              <Stat value="+50" label="Municipios" accent />
              <Stat value="+100" label="Proyectos" />
            </div>
          </div>
          <div className="group">
            <div className="gl">Card &amp; Input</div>
            <div className="row" style={{ alignItems: "stretch", gap: "16px" }}>
              <Card style={{ maxWidth: "280px" }}>
                <Eyebrow>Producto · Tribai.co</Eyebrow>
                <h3 style={{ fontFamily: "var(--font-serif)", fontWeight: 400, fontSize: "26px", margin: "10px 0 6px" }}>
                  Inteligencia que <em style={{ color: "var(--teal)", fontStyle: "italic" }}>aprende.</em>
                </h3>
                <p style={{ color: "var(--text-body)", fontSize: "14px", margin: 0, lineHeight: 1.55 }}>
                  25 años de gestión tributaria, en agentes de IA.
                </p>
              </Card>
              <div style={{ minWidth: "240px", display: "flex", flexDirection: "column", justifyContent: "center", gap: "12px" }}>
                <Field label="Correo" htmlFor="e" helper="Te respondemos en 24h.">
                  <Input id="e" type="email" placeholder="tu@empresa.co" />
                </Field>
                <Button variant="primary" style={{ width: "100%" }}>Hablemos</Button>
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
