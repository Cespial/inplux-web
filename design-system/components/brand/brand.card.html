<body>

  <script type="text/babel">
    const NS = window.INPLUXDesignSystem_318bee;

    const MarkAnimated = NS.MarkAnimated || (({ size = 40 }) =>
      <Logo variant="mark-teal" height={typeof size === "number" ? size : 40} basePath="../../assets/logos" />);

            <div style={{ display: "flex", gap: "20px", alignItems: "center" }}>
              <MarkAnimated size={40} mode="enter" />
