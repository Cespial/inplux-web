<style>

<svg width="0" height="0" style="position:absolute"><filter id="fgrano"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></svg>

<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
const D = await (await fetch("datos.json")).json();
const B = 60 / D.bpm, W = 1080, H = 1920, REG = 9, N = D.N, FPS = 30;

// ---------- formas (fijas y por cuadro de video), con caché ----------
const cache = new Map();
function desempacar(buf) {
  const dv = new DataView(buf), c = buf.byteLength / REG;
  const x = new Float32Array(N), y = new Float32Array(N), z = new Float32Array(N), s = new Float32Array(N), o = new Float32Array(N), a = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const j = i < c ? i : (i * 7919) % c, k = j * REG;
    x[i] = dv.getInt16(k, true); y[i] = dv.getInt16(k + 2, true); z[i] = dv.getInt16(k + 4, true);
    s[i] = i < c ? dv.getUint8(k + 6) / 10 : 0; o[i] = dv.getUint8(k + 7); a[i] = dv.getUint8(k + 8);
  }
  return { x, y, z, s, o, a, c };
}
async function F(ruta) {
  if (ruta === null) return VACIA;
  if (cache.has(ruta)) return cache.get(ruta);
  const f = desempacar(await (await fetch(`formas/${ruta}.bin`)).arrayBuffer());
  if (ruta === "fachada") for (let i = 0; i < N; i++) { const ax = Math.abs(f.x[i]); f.z[i] = (ax > 440 || ax < 40) && f.y[i] < 440 && f.y[i] > -480 ? 70 : (f.y[i] > 440 ? 30 : 0); }
  if (cache.size > 90) cache.delete(cache.keys().next().value);
  cache.set(ruta, f); return f;
}
function clipRuta(k, fr, f0) { const c = D.clips[k]; if (!c) return null; const i = Math.max(0, Math.min(c.n.length - 1, Math.round(c.ini + (fr - f0) * c.paso))); return `${c.clip}/${String(i).padStart(4, "0")}`; }
const R1 = new Float32Array(N), R2 = new Float32Array(N), R3 = new Float32Array(N), R4 = new Float32Array(N);
let semilla = 4242; const rnd = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < N; i++) { R1[i] = rnd(); R2[i] = rnd(); R3[i] = rnd(); R4[i] = rnd(); }
const VACIA = { x: new Float32Array(N), y: new Float32Array(N), z: new Float32Array(N), s: new Float32Array(N), o: new Float32Array(N), a: new Float32Array(N) };

// ---------- imágenes (cuadros de Blender y de los productos) ----------
const imgs = new Map();
async function img(src) {
  if (imgs.has(src)) return imgs.get(src);
  const im = new Image(); im.src = src; await new Promise(r => { im.onload = r; im.onerror = r; });
  if (imgs.size > 36) imgs.delete(imgs.keys().next().value);
  imgs.set(src, im); return im;
}

// ---------- three ----------
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true, alpha: true });
ren.setPixelRatio(1); ren.setSize(W, H, false); ren.setClearColor(0x000000, 0);
const escena = new THREE.Scene();
const FOV = 30, DC = (H / 2) / Math.tan(FOV / 2 * Math.PI / 180);
const cam = new THREE.PerspectiveCamera(FOV, W / H, 10, 40000); cam.position.set(0, 0, DC);
const geo = new THREE.BufferGeometry();
const P = new Float32Array(N * 3), S = new Float32Array(N), O = new Float32Array(N);
geo.setAttribute("position", new THREE.BufferAttribute(P, 3)); geo.setAttribute("aS", new THREE.BufferAttribute(S, 1)); geo.setAttribute("aO", new THREE.BufferAttribute(O, 1));
const mat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uDC: { value: DC }, uPulso: { value: 1 }, uGlow: { value: 0 }, uAlfa: { value: 1 }, uMarfil: { value: new THREE.Color(0xf6f2ec) }, uTeal: { value: new THREE.Color(0x00d7ca) } },
  vertexShader: `attribute float aS; attribute float aO; uniform float uDC; uniform float uPulso; uniform float uGlow; varying float vO;
    void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); gl_Position = projectionMatrix*mv; vO = aO*uGlow;
      gl_PointSize = aS*uPulso*(1.0+0.9*vO)*uDC/(-mv.z); }`,
  fragmentShader: `uniform vec3 uMarfil; uniform vec3 uTeal; uniform float uAlfa; varying float vO;
    void main(){ float d = length(gl_PointCoord-0.5); float nucleo = smoothstep(0.5,0.40,d); float halo = smoothstep(0.5,0.05,d)*0.45*vO;
      float a = max(nucleo*(1.0-0.45*vO), halo); if(a<0.01) discard; gl_FragColor = vec4(mix(uMarfil,uTeal,vO), a*uAlfa); }`,
});
const pts = new THREE.Points(geo, mat); pts.frustumCulled = false;
const grupo = new THREE.Group(); grupo.add(pts); escena.add(grupo);
// planos de producto (video real) dentro de la escena 3D
const PL = D.productos.map(p => {
  const tex = new THREE.Texture(); tex.colorSpace = THREE.SRGBColorSpace; tex.minFilter = THREE.LinearFilter;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0 }));
  const borde = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x00d7ca, transparent: true, opacity: 0 }));
  borde.position.z = -1; m.add(borde); m.visible = false; grupo.add(m); return { p, m, tex, borde };
});
function poner(pl, cx, cy, w, h, z = 6) { pl.m.position.set(cx - W / 2, H / 2 - cy, z); pl.m.scale.set(w, h, 1); pl.borde.scale.set(1 + 8 / w, 1 + 8 / h, 1); }

// ---------- utilidades ----------
const cl = v => Math.max(0, Math.min(1, v)), ap = (t, t0, d) => cl((t - t0) / d), lerp = (a, b, v) => a + (b - a) * v;
const eOut = v => 1 - Math.pow(1 - v, 3), eExpo = v => v >= 1 ? 1 : 1 - Math.pow(2, -10 * v), eIO = v => v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2;
function forma(f) { for (let i = 0; i < N; i++) { P[3*i] = f.x[i]; P[3*i+1] = f.y[i]; P[3*i+2] = f.z[i]; S[i] = f.s[i]; O[i] = f.o[i]; } }
function transicion(A, Bf, v, fuerza = 1) {
  for (let i = 0; i < N; i++) {
    const u = cl(v * 1.7), w = eIO(cl((v - 0.18 - 0.30 * R1[i]) / 0.52));
    const ang = R2[i] * 6.2832, rad = (380 + 620 * R3[i]) * fuerza, ux = eOut(u), giro = u * 1.6 * (R4[i] - .5);
    const ex = A.x[i] + Math.cos(ang + giro) * rad * ux + A.y[i] * giro * 0.25, ey = A.y[i] + Math.sin(ang + giro) * rad * ux * 0.8 + 180 * ux * ux * fuerza, ez = A.z[i] + (R1[i] - .3) * 900 * ux * fuerza;
    P[3*i] = lerp(ex, Bf.x[i], w); P[3*i+1] = lerp(ey, Bf.y[i], w); P[3*i+2] = lerp(ez, Bf.z[i], w);
    S[i] = lerp(A.s[i] * (1 - 0.35 * ux), Bf.s[i], w) * (0.75 + 0.25 * Math.abs(1 - 2 * w)) + (A.s[i] + Bf.s[i] > 0 ? 0.6 * Math.sin(w * Math.PI) : 0);
    O[i] = w > .5 ? Bf.o[i] : A.o[i];
  }
}
function caer(A, v) { // la figura se deshace hacia abajo (fin de un plano)
  for (let i = 0; i < N; i++) { const u = eIO(cl((v - 0.3 * R1[i]) / 0.7)); P[3*i] = A.x[i] + (R2[i] - .5) * 300 * u; P[3*i+1] = A.y[i] - 900 * u * u; P[3*i+2] = A.z[i] + (R3[i] - .5) * 400 * u; S[i] = A.s[i] * (1 - 0.6 * u); O[i] = 0; }
}
function estallar(A, v) { // impacto final: los puntos salen disparados
  for (let i = 0; i < N; i++) { const u = eOut(cl(v)); const ang = R2[i] * 6.2832, r = (200 + 1400 * R3[i]) * u; P[3*i] = A.x[i] + Math.cos(ang) * r; P[3*i+1] = A.y[i] + Math.sin(ang) * r; P[3*i+2] = A.z[i] + (R1[i] - .5) * 600 * u; S[i] = A.s[i] * (1 - 0.7 * u) + 0.8 * u * (1 - u); O[i] = A.o[i]; }
}
function pulso(t, fuerza) { const b = t / B, f = b - Math.floor(b); return 1 + fuerza * Math.exp(-9 * f); }
function proyectar(x, y, z) { const v = new THREE.Vector3(x - W / 2, H / 2 - y, z).applyMatrix4(grupo.matrixWorld).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; }

// ---------- capa de texto ----------
const ui = document.getElementById("ui"), svg = document.getElementById("lin");
const el = (tag, cls, html, padre = ui) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; padre.appendChild(e); return e; };
const sv = (tag, at, padre = svg) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in at) e.setAttribute(k, at[k]); padre.appendChild(e); return e; };
const palabras = t => t.split(" ").map(w => `<span>${w}&nbsp;</span>`).join("");
const pos = (e, x, y) => { if (x != null) e.style.left = x + "px"; if (y != null) e.style.top = y + "px"; return e; };
const entra = (e, g, g0, sale = 1e9, dy = 30, d = 0.6) => { const a = eExpo(ap(g, g0, d)), z = ap(g, sale, 0.5); e.style.opacity = a * (1 - z); e.style.transform = `translateY(${(1 - a) * dy - z * 20}px)`; return a * (1 - z); };
const porPalabra = (e, g, g0, sale) => { const sp = [...e.children]; sp.forEach((s, j) => { const a = eOut(ap(g, g0 + j * 0.12, 0.5)); s.style.opacity = a; s.style.transform = `translateY(${(1 - a) * 24}px)`; }); const z = ap(g, sale, 0.5); e.style.opacity = g < g0 ? 0 : 1 - z; e.style.transform = `translateY(${-z * 24}px)`; };

const gancho = D.gancho.map((t, i) => { const e = el("div", "gancho op", palabras(t)); e.style.top = (1500 + i * 72) + "px"; return e; });
const drop = el("div", "op", D.drop); drop.id = "drop";
const rot = D.oficios.map(o => { const r = el("div", "rot op"); el("div", "n", `${o.n} / 03`, r); el("div", "w", o.verbo, r); return r; });
const copy = D.oficios.map(o => el("div", "copy op", palabras(o.copy)));
const flujo = el("div", "copy op", palabras(D.flujo));
const pie1 = pos(el("div", "pie op", D.pieChat), 560, 900);
const burb = D.burbujas.map(b => { const e = el("div", "burb op"); e.style.width = b.w + "px"; e.style.top = b.y + "px"; el("img", null, null, e).src = b.src; return e; });
const pasos = D.pasos.map((p, i) => pos(el("div", "pil op", `<b>${String(i + 1).padStart(2, "0")}</b>${p}`), 72 + (i % 2) * 470, 1530 + Math.floor(i / 2) * 92));
const WF = document.createElementNS("http://www.w3.org/2000/svg", "svg"); WF.id = "wf"; WF.setAttribute("viewBox", "0 0 960 600"); ui.appendChild(WF); WF.style.opacity = 0;
const BLOQ = [
  [["rect", { x: 14, y: 10, width: 932, height: 44, rx: 10 }], ["rect", { x: 30, y: 22, width: 72, height: 20, rx: 4 }], ["path", { d: "M360 32H394M412 32H464M484 32H520M540 32H604" }], ["rect", { x: 826, y: 18, width: 112, height: 28, rx: 6 }]],
  [["path", { d: "M30 236H46" }], ["rect", { x: 54, y: 231, width: 232, height: 10, rx: 2 }]],
  [["rect", { x: 30, y: 258, width: 640, height: 64, rx: 6 }]],
  [["rect", { x: 30, y: 332, width: 440, height: 54, rx: 6 }]],
  [["path", { d: "M30 418H432M30 440H220" }]],
  [["rect", { x: 29, y: 471, width: 126, height: 33, rx: 6 }], ["rect", { x: 164, y: 471, width: 115, height: 33, rx: 6 }], ["path", { d: "M30 562H930" }]],
].map(b => b.map(([tag, at]) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in at) e.setAttribute(k, at[k]); e.setAttribute("pathLength", "1"); e.setAttribute("stroke-dasharray", "1 1"); WF.appendChild(e); return e; }));
const marcoWF = (() => { const e = document.createElementNS("http://www.w3.org/2000/svg", "rect"); for (const [k, v] of Object.entries({ x: 1.5, y: 1.5, width: 957, height: 597, rx: 16 })) e.setAttribute(k, v); e.setAttribute("stroke-dasharray", "6 10"); e.style.stroke = "rgba(0,215,202,.5)"; WF.appendChild(e); return e; })();
const estilete = sv("path", { stroke: "#00d7ca", "stroke-width": 4, fill: "none", "stroke-linecap": "round" });
const etq = D.productos.map(p => el("div", "et op", p.nombre));
const VENT = D.ventanas, WF0 = [60, 300, 960, 600];
const lemas = D.lemas.map((l, i) => pos(el("div", "pil op", l), 72, 1520 + i * 78));
const pieDev = pos(el("div", "pie op", D.pieDev), 72, 1762);
const ins = D.lugares.map((n, i) => el("div", "ins op", `<b>${String(i + 1).padStart(2, "0")}</b>${n}`));
const fmts = D.formatos.map((f, i) => el("div", "fmt op", `${f}<small>${["01", "02", "03", "04"][i]} / 04</small>`));
const peds = D.oficios.map((o, k) => pos(el("div", "ped op", `<b>${o.n}</b><span>${o.verbo}</span>`), 20 + k * 355, null));
const cierreF = el("div", "copy op", palabras(D.cierreFrase)); Object.assign(cierreF.style, { top: "300px", fontSize: "52px", textAlign: "center", left: "90px", right: "90px" });
const lock = D.cierre.map(f => { const e = el("div", "lock op", f.texto); Object.assign(e.style, { top: f.y + "px", fontSize: f.tam + "px", color: f.color, letterSpacing: f.esp, fontWeight: f.peso || 400, padding: "0 90px", lineHeight: 1.2 }); return e; });
const marca = document.getElementById("marca"), cont = document.getElementById("cont"), flash = document.getElementById("flash"), negro = document.getElementById("negro");
const fondo = document.getElementById("fondo"), barraA = document.getElementById("barraA"), barraB = document.getElementById("barraB"), turb = document.getElementById("turb");
const G = D.gradas;
function yGrada(k) { return G.y1 - G.alto * (k + 0.5) - 20; }

// ---------- línea de tiempo (en golpes) ----------
let planoActual = null;
window.seek = async t => {
  const g = t / B, fr = Math.round(t * FPS);
  let rotY = 0, rotX = 0, esc = 1, glow = 1, alfa = 1, pul = pulso(t, 0.14), fl = 0, fy = 0, oscuro = 0, barras = 0;
  let fondoSrc = null, fondoA = 0; cam.position.set(0, 0, DC); cam.lookAt(0, 0, 0); cam.up.set(0, 1, 0);
  for (const pl of PL) { pl.m.visible = false; }
  const golpeFl = (g0, f = 0.12) => g >= g0 && g < g0 + 0.5 ? f * Math.exp(-14 * (g - g0)) : 0;
  const cuadro3d = (plano, g0, nmax) => { if (!nmax) return null; const i = Math.max(0, Math.min(nmax - 1, Math.round((g - g0) * B * FPS))); return `3d/${plano}/${String(i).padStart(4, "0")}.png`; };
  turb.setAttribute("seed", String(fr % 97 + 1));
  const LOGO = await F("logo");

  if (g < 8) { // GANCHO: macro del cincel (Blender), franjas de cine, frase de gancho; 7,5–8 negro
    fondoSrc = cuadro3d("cincel", 0, D.planos3d.cincel); fondoA = g < 7.5 ? 1 - ap(g, 7.0, 0.5) * 0.3 : 0; barras = 1; forma(VACIA); alfa = 0;
    oscuro = g >= 7.5 ? 1 : 0; fl = golpeFl(0, .18);
  } else if (g < 14) { // DROP: título en mármol; las franjas se abren
    fondoSrc = cuadro3d("titulo", 8, D.planos3d.titulo); fondoA = 1 - ap(g, 13.5, 0.5); barras = 1 - eOut(ap(g, 8, 1.3)); forma(VACIA); alfa = 0; fl = golpeFl(8, .3);
  } else if (g < 18) { // ACTO I: el ingeniero vivo
    const A = await F(clipRuta("ingeniero", fr, Math.round(14 * B * FPS)));
    if (g < 17.4) forma(A); else caer(A, ap(g, 17.4, 0.6));
    esc = 1.02 + 0.05 * eIO(ap(g, 14, 3.5)) + 0.015 * Math.exp(-7 * (g % 1)); rotY = lerp(-0.05, 0.04, eIO(ap(g, 14, 3.5))); glow = 0; fl = golpeFl(14, .14);
  } else if (g < 34) { // acueducto 3D (Blender): se construye, corre el agua con el chat, cuatro pasos
