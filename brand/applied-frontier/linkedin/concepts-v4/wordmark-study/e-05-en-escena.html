<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1584, initial-scale=1" />
    <title>INPLUX — Applied Frontier — firma 05-en-escena sobre Estratos en ejecución</title>
    <link rel="stylesheet" href="../base.css" />
  </head>
  <body>
    <main class="cover" aria-label="INPLUX Applied Frontier — Estratos en ejecución — firma: Tumbada en la escena">
    <svg class="layer field" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <pattern id="baseGrid" width="44" height="44" patternUnits="userSpaceOnUse">
          <path d="M44 0H0V44" fill="none" stroke="#F9F5EF" stroke-opacity=".022" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1584" height="396" fill="#0c0c0b"/>
      <rect width="1584" height="396" fill="url(#baseGrid)"/>
    </svg>
    <svg class="layer lift" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <radialGradient id="baseLift" cx="207" cy="365" r="330" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#F9F5EF" stop-opacity=".07"/>
          <stop offset=".45" stop-color="#F9F5EF" stop-opacity=".026"/>
          <stop offset="1" stop-color="#F9F5EF" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="1584" height="396" fill="url(#baseLift)"/>
    </svg>

    <svg class="layer scene" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <filter id="eDof0" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="eDof1" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="4.9"/></filter>
        <filter id="eDof2" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="3.4"/></filter>
        <filter id="eDof3" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="2.2"/></filter>
        <filter id="eDof4" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="1.2"/></filter>
        <filter id="eDof5" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="0.5"/></filter>
        <filter id="eDof6" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="0"/></filter>
        <linearGradient id="eTop" x1="0" y1="0" x2=".55" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
          <stop offset="1" stop-color="#FFFFFF" stop-opacity=".42"/>
        </linearGradient>
        <linearGradient id="eLeader" x1="0" y1="0" x2=".5" y2="1">
          <stop offset="0" stop-color="#5BEFE1"/>
          <stop offset=".5" stop-color="#00D7CA"/>
          <stop offset="1" stop-color="#00A79E"/>
        </linearGradient>
        <radialGradient id="eBloom" cx="1216" cy="128" r="232" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#00D7CA" stop-opacity=".11"/>
          <stop offset=".5" stop-color="#00D7CA" stop-opacity=".03"/>
          <stop offset="1" stop-color="#00D7CA" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect width="1584" height="396" fill="url(#eBloom)"/>

      <g class="slab"><g filter="url(#eDof6)" transform="matrix(3.0632 0 -1.496 -2.4166 1124 141.708)"><rect width="42" height="13" rx="6.5" fill="#04524D"/></g><g class="signal" filter="url(#eDof6)" transform="matrix(3.0632 0 -1.496 -2.4166 1124 126)"><rect width="42" height="13" rx="6.5" fill="url(#eLeader)"/></g><g filter="url(#eDof6)" transform="matrix(2.9204 0 -1.496 -2.4166 1127 124.5)"><rect width="42" height="13" rx="6.5" fill="#FFFFFF" opacity="0.5"/></g></g>
      <g class="slab"><g filter="url(#eDof5)" transform="matrix(3.2352 0 -1.58 -2.5523 1082 178.59)"><rect width="42" height="13" rx="6.5" fill="#000000" opacity="0.62"/></g><g filter="url(#eDof5)" transform="matrix(3.2352 0 -1.58 -2.5523 1082 162)"><rect width="42" height="13" rx="6.5" fill="url(#eTop)" opacity="0.195"/></g><g filter="url(#eDof5)" transform="matrix(3.0924 0 -1.58 -2.5523 1085 160.5)"><rect width="42" height="13" rx="6.5" fill="#FFFFFF" opacity="0.40950000000000003"/></g></g>
      <g class="slab"><g filter="url(#eDof4)" transform="matrix(3.4072 0 -1.664 -2.688 1040 215.472)"><rect width="42" height="13" rx="6.5" fill="#000000" opacity="0.62"/></g><g filter="url(#eDof4)" transform="matrix(3.4072 0 -1.664 -2.688 1040 198)"><rect width="42" height="13" rx="6.5" fill="url(#eTop)" opacity="0.145"/></g><g filter="url(#eDof4)" transform="matrix(3.2644 0 -1.664 -2.688 1043 196.5)"><rect width="42" height="13" rx="6.5" fill="#FFFFFF" opacity="0.3045"/></g></g>
      <g class="slab"><g filter="url(#eDof3)" transform="matrix(3.5792 0 -1.748 -2.8237 998 252.354)"><rect width="42" height="13" rx="6.5" fill="#000000" opacity="0.62"/></g><g filter="url(#eDof3)" transform="matrix(3.5792 0 -1.748 -2.8237 998 234)"><rect width="42" height="13" rx="6.5" fill="url(#eTop)" opacity="0.112"/></g><g filter="url(#eDof3)" transform="matrix(3.4364 0 -1.748 -2.8237 1001 232.5)"><rect width="42" height="13" rx="6.5" fill="#FFFFFF" opacity="0.23520000000000002"/></g></g>
      <g class="slab"><g filter="url(#eDof2)" transform="matrix(3.7512 0 -1.832 -2.9594 956 289.236)"><rect width="42" height="13" rx="6.5" fill="#000000" opacity="0.62"/></g><g filter="url(#eDof2)" transform="matrix(3.7512 0 -1.832 -2.9594 956 270)"><rect width="42" height="13" rx="6.5" fill="url(#eTop)" opacity="0.088"/></g><g filter="url(#eDof2)" transform="matrix(3.6084 0 -1.832 -2.9594 959 268.5)"><rect width="42" height="13" rx="6.5" fill="#FFFFFF" opacity="0.1848"/></g></g>
      <g class="slab"><g filter="url(#eDof1)" transform="matrix(3.9232 0 -1.916 -3.0951 914 326.118)"><rect width="42" height="13" rx="6.5" fill="#000000" opacity="0.62"/></g><g filter="url(#eDof1)" transform="matrix(3.9232 0 -1.916 -3.0951 914 306)"><rect width="42" height="13" rx="6.5" fill="url(#eTop)" opacity="0.07"/></g><g filter="url(#eDof1)" transform="matrix(3.7804 0 -1.916 -3.0951 917 304.5)"><rect width="42" height="13" rx="6.5" fill="#FFFFFF" opacity="0.14700000000000002"/></g></g>
      <g class="slab"><g filter="url(#eDof0)" transform="matrix(4.0952 0 -2 -3.2308 872 363)"><rect width="42" height="13" rx="6.5" fill="#000000" opacity="0.62"/></g><g filter="url(#eDof0)" transform="matrix(4.0952 0 -2 -3.2308 872 342)"><rect width="42" height="13" rx="6.5" fill="url(#eTop)" opacity="0.055"/></g><g filter="url(#eDof0)" transform="matrix(3.9524 0 -2 -3.2308 875 340.5)"><rect width="42" height="13" rx="6.5" fill="#FFFFFF" opacity="0.1155"/></g></g>

      <g stroke="#F9F5EF" stroke-opacity=".16" stroke-width="1.25" fill="none">
        <path d="M1150 96v-15h15"/>
        <path d="M1300 148v15h-15"/>
      </g>
    </svg>

    <svg class="layer" style="z-index:8" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <linearGradient id="wmPlane" x1="0" y1="0" x2=".6" y2="1">
          <stop offset="0" stop-color="#F9F5EF" stop-opacity=".05"/>
          <stop offset="1" stop-color="#F9F5EF" stop-opacity="0"/>
        </linearGradient>
        <filter id="wmPlaneSoft" x="-25%" y="-60%" width="150%" height="220%">
          <feGaussianBlur stdDeviation="16"/>
        </filter>
      </defs>
      <!-- La superficie sobre la que se acuesta el texto. Sin ella el sesgo
           lee como deformación en vez de como perspectiva. -->
      <polygon points="452,344 906,344 992,290 538,290" fill="url(#wmPlane)" filter="url(#wmPlaneSoft)"/>
      <g class="wordmark" transform="translate(486 330) matrix(1 0 0.619 1 0 0) scale(1 0.62)">
        <g font-family="Geist INPLUX, sans-serif" font-size="54" font-weight="540" letter-spacing="-2.1">
          <text x="0" y="-2" fill="#F9F5EF" fill-opacity=".23">APPLIED FRONTIER.</text>
          <text x="0" y="0" fill="#0E0F0D">APPLIED FRONTIER.</text>
        </g>
      </g>
    </svg>

    <svg class="layer grain" viewBox="0 0 1584 396" aria-hidden="true" preserveAspectRatio="none">
      <defs>
        <filter id="baseGrain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="17" stitchTiles="stitch"/>
          <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0"/>
        </filter>
      </defs>
      <rect width="1584" height="396" filter="url(#baseGrain)"/>
    </svg>
    <div class="layer edge-shade" aria-hidden="true"></div>

    <div class="proof-layer" aria-hidden="true">
      <div class="proof-shape proof-avatar-clear"></div>
      <div class="proof-shape proof-avatar"></div>
      <div class="proof-shape proof-button"></div>
      <div class="proof-shape proof-rail"></div>
    </div>
    </main>
  </body>
</html>
