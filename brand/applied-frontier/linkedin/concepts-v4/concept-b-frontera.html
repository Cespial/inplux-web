<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1584, initial-scale=1" />
    <title>INPLUX — Applied Frontier — concepto B · La frontera es una línea</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main class="cover" aria-label="INPLUX Applied Frontier — La frontera es una línea">
    <svg class="layer field" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <pattern id="baseGrid" width="44" height="44" patternUnits="userSpaceOnUse">
          <path d="M44 0H0V44" fill="none" stroke="#F9F5EF" stroke-opacity=".022" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1584" height="396" fill="#0c0c0b"/>
      <rect width="1584" height="396" fill="url(#baseGrid)"/>
    </svg>
    <svg class="layer lift" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <radialGradient id="baseLift" cx="207" cy="365" r="330" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#F9F5EF" stop-opacity=".07"/>
          <stop offset=".45" stop-color="#F9F5EF" stop-opacity=".026"/>
          <stop offset="1" stop-color="#F9F5EF" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="1584" height="396" fill="url(#baseLift)"/>
    </svg>

    <svg class="layer scene" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <filter id="bDof0" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="10"/></filter>
        <filter id="bDof1" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="bDof2" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="4.4"/></filter>
        <radialGradient id="bResolved" cx="1230" cy="150" r="420" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#F9F5EF" stop-opacity=".035"/>
          <stop offset="1" stop-color="#F9F5EF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bBloom" cx="1000" cy="212" r="196" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#00D7CA" stop-opacity=".11"/>
          <stop offset=".5" stop-color="#00D7CA" stop-opacity=".03"/>
          <stop offset="1" stop-color="#00D7CA" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bFlare" x1="770" y1="212" x2="1280" y2="212" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#00D7CA" stop-opacity="0"/>
          <stop offset=".45" stop-color="#5FF3E7" stop-opacity=".15"/>
          <stop offset="1" stop-color="#00D7CA" stop-opacity="0"/>
        </linearGradient>
        <filter id="bFlareBlur" x="-20%" y="-500%" width="140%" height="1100%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
      </defs>

      <rect width="1584" height="396" fill="url(#bResolved)"/>

      <!-- Lado sin resolver: el mismo módulo, rotado, sin alinear, fuera de foco. -->
      <g fill="#F9F5EF">
        <g transform="rotate(15 129 300)" filter="url(#bDof0)" opacity="0.130"><rect x="92" y="300" width="74" height="23" rx="11.5"/></g>
        <g transform="rotate(-9 208 344)" filter="url(#bDof1)" opacity="0.113"><rect x="186" y="344" width="44" height="14" rx="6.8"/></g>
        <g transform="rotate(11 306 262)" filter="url(#bDof2)" opacity="0.096"><rect x="258" y="262" width="96" height="30" rx="14.9"/></g>
        <g transform="rotate(-13 106 368)" filter="url(#bDof0)" opacity="0.079"><rect x="78" y="368" width="56" height="17" rx="8.7"/></g>
        <g transform="rotate(17 364 316)" filter="url(#bDof1)" opacity="0.062"><rect x="338" y="316" width="52" height="16" rx="8.0"/></g>
        <g transform="rotate(-10 457 276)" filter="url(#bDof2)" opacity="0.130"><rect x="416" y="276" width="82" height="25" rx="12.7"/></g>
        <g transform="rotate(14 323 360)" filter="url(#bDof0)" opacity="0.113"><rect x="304" y="360" width="38" height="12" rx="5.9"/></g>
        <g transform="rotate(-16 511 334)" filter="url(#bDof1)" opacity="0.096"><rect x="478" y="334" width="66" height="20" rx="10.2"/></g>
        <g transform="rotate(9 584 288)" filter="url(#bDof2)" opacity="0.079"><rect x="560" y="288" width="48" height="15" rx="7.4"/></g>
        <g transform="rotate(-12 563 374)" filter="url(#bDof0)" opacity="0.062"><rect x="524" y="374" width="78" height="24" rx="12.1"/></g>
        <g transform="rotate(15 669 326)" filter="url(#bDof1)" opacity="0.130"><rect x="640" y="326" width="58" height="18" rx="9.0"/></g>
        <g transform="rotate(-14 727 268)" filter="url(#bDof2)" opacity="0.113"><rect x="706" y="268" width="42" height="13" rx="6.5"/></g>
        <g transform="rotate(10 786 352)" filter="url(#bDof0)" opacity="0.096"><rect x="750" y="352" width="72" height="22" rx="11.1"/></g>
        <g transform="rotate(-17 853 302)" filter="url(#bDof1)" opacity="0.079"><rect x="826" y="302" width="54" height="17" rx="8.4"/></g>
        <g transform="rotate(12 903 358)" filter="url(#bDof2)" opacity="0.062"><rect x="884" y="358" width="38" height="12" rx="5.9"/></g>
        <g transform="rotate(-8 941 264)" filter="url(#bDof0)" opacity="0.130"><rect x="910" y="264" width="62" height="19" rx="9.6"/></g>
        <g transform="rotate(16 170 250)" filter="url(#bDof1)" opacity="0.113"><rect x="150" y="250" width="40" height="12" rx="6.2"/></g>
        <g transform="rotate(-11 413 246)" filter="url(#bDof2)" opacity="0.096"><rect x="396" y="246" width="34" height="11" rx="5.3"/></g>
        <g transform="rotate(13 701 380)" filter="url(#bDof0)" opacity="0.079"><rect x="676" y="380" width="50" height="15" rx="7.7"/></g>
      </g>

      <!-- Lado resuelto: mismo módulo, alineado y nítido. -->
      <g fill="#F9F5EF">
        <rect x="1040" y="100" width="63" height="19.5" rx="9.75" opacity="0.055"/>
        <rect x="1116" y="100" width="63" height="19.5" rx="9.75" opacity="0.066"/>
        <rect x="1192" y="100" width="63" height="19.5" rx="9.75" opacity="0.077"/>
        <rect x="1268" y="100" width="63" height="19.5" rx="9.75" opacity="0.088"/>
        <rect x="1344" y="100" width="63" height="19.5" rx="9.75" opacity="0.099"/>
        <rect x="1040" y="136" width="63" height="19.5" rx="9.75" opacity="0.097"/>
        <rect x="1116" y="136" width="63" height="19.5" rx="9.75" opacity="0.108"/>
        <rect x="1192" y="136" width="63" height="19.5" rx="9.75" opacity="0.119"/>
        <rect x="1268" y="136" width="63" height="19.5" rx="9.75" opacity="0.130"/>
        <rect x="1040" y="172" width="63" height="19.5" rx="9.75" opacity="0.139"/>
        <rect x="1116" y="172" width="63" height="19.5" rx="9.75" opacity="0.150"/>
        <rect x="1192" y="172" width="63" height="19.5" rx="9.75" opacity="0.161"/>
        <rect x="1268" y="172" width="63" height="19.5" rx="9.75" opacity="0.172"/>
        <rect x="1344" y="172" width="63" height="19.5" rx="9.75" opacity="0.183"/>
      </g>

      <rect width="1584" height="396" fill="url(#bBloom)"/>
      <rect x="770" y="209.5" width="510" height="5" fill="url(#bFlare)" filter="url(#bFlareBlur)"/>

      <!-- La frontera. Entra discontinua, sale continua. -->
      <path d="M0 212H1000" stroke="#F9F5EF" stroke-opacity=".16" stroke-width="1.5" stroke-dasharray="3 10"/>
      <path d="M1000 212H1584" stroke="#F9F5EF" stroke-opacity=".34" stroke-width="1.5"/>
      <circle class="signal" cx="1000" cy="212" r="5.5" fill="#00D7CA"/>

      <g stroke="#F9F5EF" stroke-opacity=".15" stroke-width="1.25" fill="none">
        <path d="M972 180v-15h15"/>
        <path d="M1028 244v15h-15"/>
      </g>
    </svg>

    <p class="wordmark">APPLIED FRONTIER.</p>

    <svg class="layer grain" viewBox="0 0 1584 396" aria-hidden="true" preserveAspectRatio="none">
      <defs>
        <filter id="baseGrain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="17" stitchTiles="stitch"/>
          <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0"/>
        </filter>
      </defs>
      <rect width="1584" height="396" filter="url(#baseGrain)"/>
    </svg>
    <div class="layer edge-shade" aria-hidden="true"></div>

    <div class="proof-layer" aria-hidden="true">
      <div class="proof-shape proof-avatar-clear"></div>
      <div class="proof-shape proof-avatar"></div>
      <div class="proof-shape proof-button"></div>
      <div class="proof-shape proof-rail"></div>
    </div>
    </main>
  </body>
</html>
