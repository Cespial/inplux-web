<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1584, initial-scale=1" />
    <title>INPLUX — Applied Frontier — concepto D · Estado de sistema</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main class="cover" aria-label="INPLUX Applied Frontier — Estado de sistema">
    <svg class="layer field" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <pattern id="baseGrid" width="44" height="44" patternUnits="userSpaceOnUse">
          <path d="M44 0H0V44" fill="none" stroke="#F9F5EF" stroke-opacity=".022" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1584" height="396" fill="#0c0c0b"/>
      <rect width="1584" height="396" fill="url(#baseGrid)"/>
    </svg>
    <svg class="layer lift" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <radialGradient id="baseLift" cx="207" cy="365" r="330" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#F9F5EF" stop-opacity=".07"/>
          <stop offset=".45" stop-color="#F9F5EF" stop-opacity=".026"/>
          <stop offset="1" stop-color="#F9F5EF" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="1584" height="396" fill="url(#baseLift)"/>
    </svg>

    <svg class="layer scene" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <filter id="dDof0" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="0"/></filter>
        <filter id="dDof1" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="1.6"/></filter>
        <filter id="dDof2" x="-45%" y="-170%" width="190%" height="440%"><feGaussianBlur stdDeviation="3.6"/></filter>
        <linearGradient id="dCap" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#F9F5EF" stop-opacity=".9"/>
          <stop offset="1" stop-color="#F9F5EF" stop-opacity=".35"/>
        </linearGradient>
        <radialGradient id="dBloom" cx="898" cy="94" r="164" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#00D7CA" stop-opacity=".1"/>
          <stop offset="1" stop-color="#00D7CA" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect width="1584" height="396" fill="url(#dBloom)"/>

      <circle class="signal" cx="898" cy="92" r="5" fill="#00D7CA"/>
      <text x="926" y="98" font-family="Geist Mono INPLUX, monospace" font-size="14"
            font-weight="640" letter-spacing="3.2" fill="#F9F5EF" fill-opacity=".32">EN PRODUCCIÓN</text>
      <path d="M898 122H1408" stroke="#F9F5EF" stroke-opacity=".085" stroke-width="1"/>

      <g filter="url(#dDof1)" opacity="0.42"><g transform="matrix(2.2857 0 0 2 898 157)"><rect width="42" height="13" rx="6.5" fill="url(#dCap)" opacity="0.34"/></g><text x="1046" y="178" font-family="Geist Mono INPLUX, monospace" font-size="26" font-weight="560" letter-spacing="1.4" fill="#F9F5EF" fill-opacity=".78">KELSEN</text></g>
      <g filter="url(#dDof0)" opacity="0.72"><g transform="matrix(2.9048 0 0 2 898 213)"><rect width="42" height="13" rx="6.5" fill="url(#dCap)" opacity="0.34"/></g><text x="1046" y="234" font-family="Geist Mono INPLUX, monospace" font-size="26" font-weight="560" letter-spacing="1.4" fill="#F9F5EF" fill-opacity=".78">GOBIA</text></g>
      <g filter="url(#dDof0)" opacity="0.72"><g transform="matrix(2.5714 0 0 2 898 269)"><rect width="42" height="13" rx="6.5" fill="url(#dCap)" opacity="0.34"/></g><text x="1046" y="290" font-family="Geist Mono INPLUX, monospace" font-size="26" font-weight="560" letter-spacing="1.4" fill="#F9F5EF" fill-opacity=".78">TRIBAI</text></g>
      <g filter="url(#dDof1)" opacity="0.42"><g transform="matrix(2 0 0 2 898 325)"><rect width="42" height="13" rx="6.5" fill="url(#dCap)" opacity="0.34"/></g><text x="1046" y="346" font-family="Geist Mono INPLUX, monospace" font-size="26" font-weight="560" letter-spacing="1.4" fill="#F9F5EF" fill-opacity=".78">LAUDOS</text></g>

      <g stroke="#F9F5EF" stroke-opacity=".09" stroke-width="1.25">
        <path d="M1400 344h16M1408 336v16"/>
      </g>
    </svg>

    <p class="wordmark">APPLIED FRONTIER.</p>

    <svg class="layer grain" viewBox="0 0 1584 396" aria-hidden="true" preserveAspectRatio="none">
      <defs>
        <filter id="baseGrain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="17" stitchTiles="stitch"/>
          <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0"/>
        </filter>
      </defs>
      <rect width="1584" height="396" filter="url(#baseGrain)"/>
    </svg>
    <div class="layer edge-shade" aria-hidden="true"></div>

    <div class="proof-layer" aria-hidden="true">
      <div class="proof-shape proof-avatar-clear"></div>
      <div class="proof-shape proof-avatar"></div>
      <div class="proof-shape proof-button"></div>
      <div class="proof-shape proof-rail"></div>
    </div>
    </main>
  </body>
</html>
