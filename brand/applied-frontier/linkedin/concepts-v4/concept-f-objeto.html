<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1584, initial-scale=1" />
    <title>INPLUX — Applied Frontier — concepto F · Un solo objeto</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main class="cover" aria-label="INPLUX Applied Frontier — Un solo objeto">
    <svg class="layer field" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <pattern id="baseGrid" width="44" height="44" patternUnits="userSpaceOnUse">
          <path d="M44 0H0V44" fill="none" stroke="#F9F5EF" stroke-opacity=".022" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1584" height="396" fill="#0c0c0b"/>
      <rect width="1584" height="396" fill="url(#baseGrid)"/>
    </svg>
    <svg class="layer lift" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <radialGradient id="baseLift" cx="207" cy="365" r="330" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#F9F5EF" stop-opacity=".07"/>
          <stop offset=".45" stop-color="#F9F5EF" stop-opacity=".026"/>
          <stop offset="1" stop-color="#F9F5EF" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="1584" height="396" fill="url(#baseLift)"/>
    </svg>

    <svg class="layer scene" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <linearGradient id="fBody" x1=".08" y1="0" x2=".72" y2="1">
          <stop offset="0" stop-color="#4c514a"/>
          <stop offset=".28" stop-color="#2c302b"/>
          <stop offset=".68" stop-color="#181b17"/>
          <stop offset="1" stop-color="#0d0f0c"/>
        </linearGradient>
        <linearGradient id="fSpec" x1=".1" y1="0" x2=".45" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity=".46"/>
          <stop offset=".2" stop-color="#FFFFFF" stop-opacity=".07"/>
          <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="fHorizon" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
          <stop offset="0" stop-color="#F9F5EF" stop-opacity="0"/>
          <stop offset="1" stop-color="#F9F5EF" stop-opacity=".055"/>
        </linearGradient>
        <radialGradient id="fBounce" cx="1262.8400000000001" cy="284" r="290" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#00D7CA" stop-opacity=".075"/>
          <stop offset="1" stop-color="#00D7CA" stop-opacity="0"/>
        </radialGradient>
        <filter id="fShadow" x="-40%" y="-160%" width="180%" height="420%">
          <feGaussianBlur stdDeviation="30"/>
        </filter>
        <filter id="fEdgeSoft" x="-40%" y="-180%" width="180%" height="460%">
          <feGaussianBlur stdDeviation="9"/>
        </filter>
      </defs>

      <!-- Suelo apenas insinuado: sin él, el objeto flota en la nada. -->
      <rect x="0" y="238" width="1584" height="158" fill="url(#fHorizon)"/>

      <!-- Sombra de contacto: se lee porque hay suelo debajo. -->
      <ellipse cx="1075" cy="304" rx="318" ry="34"
               fill="#000" opacity=".85" filter="url(#fShadow)"/>

      <!-- Luz de canto teal asomando por el filo inferior derecho. -->
      <g class="signal" filter="url(#fEdgeSoft)">
        <g transform="matrix(13.7619 0 -5.8462 -8 823 195)"><rect width="42" height="13" rx="6.5" fill="#00D7CA" opacity="0.62"/></g>
      </g>

      <!-- Espesor -->
      <g transform="matrix(13.7619 0 -5.8462 -8 814 206)"><rect width="42" height="13" rx="6.5" fill="#0b0d0a"/></g>

      <!-- Cuerpo -->
      <g transform="matrix(13.7619 0 -5.8462 -8 812 176)"><rect width="42" height="13" rx="6.5" fill="url(#fBody)"/></g>

      <!-- Reflejo especular: barrido de luz por el hombro superior izquierdo. -->
      <g transform="matrix(13.5238 0 -5.8462 -8 817 178.5)"><rect width="42" height="13" rx="6.5" fill="url(#fSpec)"/></g>

      <rect width="1584" height="396" fill="url(#fBounce)"/>
    </svg>

    <p class="wordmark">APPLIED FRONTIER.</p>

    <svg class="layer grain" viewBox="0 0 1584 396" aria-hidden="true" preserveAspectRatio="none">
      <defs>
        <filter id="baseGrain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="17" stitchTiles="stitch"/>
          <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0"/>
        </filter>
      </defs>
      <rect width="1584" height="396" filter="url(#baseGrain)"/>
    </svg>
    <div class="layer edge-shade" aria-hidden="true"></div>

    <div class="proof-layer" aria-hidden="true">
      <div class="proof-shape proof-avatar-clear"></div>
      <div class="proof-shape proof-avatar"></div>
      <div class="proof-shape proof-button"></div>
      <div class="proof-shape proof-rail"></div>
    </div>
    </main>
  </body>
</html>
