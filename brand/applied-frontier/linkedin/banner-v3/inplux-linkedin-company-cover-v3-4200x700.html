<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=4200, initial-scale=1" />
    <title>INPLUX — Applied Frontier — portada de Página v3</title>
    <link rel="stylesheet" href="field.css" />
    <link rel="stylesheet" href="company.css" />
  </head>
  <body>
    <main
      class="cover"
      aria-label="INPLUX Applied Frontier. Fábrica de software agéntica para legaltech y gobierno. Soluciones a la medida."
    >
      <!-- PLANO LEJANO -->
      <svg class="plane plane--far" viewBox="0 0 4200 700" aria-hidden="true">
        <rect width="4200" height="700" fill="#0c0c0b" />
        <g>
          <polygon points="-1400,830 -520,830 1497,-130 617,-130" fill="#141513" />
          <polygon points="180,830 660,830 2677,-130 2197,-130" fill="#111210" />
          <polygon points="3180,830 3880,830 5897,-130 5197,-130" fill="#131412" />
          <polygon points="2640,830 2820,830 4837,-130 4657,-130" fill="#171815" />
        </g>
      </svg>

      <!-- PLANO MEDIO -->
      <svg class="plane plane--mid" viewBox="0 0 4200 700" aria-hidden="true">
        <defs>
          <pattern id="cGridMinor" width="70" height="70" patternUnits="userSpaceOnUse">
            <path d="M70 0H0V70" fill="none" stroke="#F9F5EF" stroke-opacity=".028" stroke-width="1.5" />
          </pattern>
        </defs>
        <rect width="4200" height="700" fill="url(#cGridMinor)" />
        <polygon
          points="-480,830 -220,830 1797,-130 1537,-130"
          fill="#20221e"
          fill-opacity=".5"
          stroke="#F9F5EF"
          stroke-opacity=".035"
          stroke-width="2"
        />
        <polygon
          points="3760,830 4090,830 6107,-130 5777,-130"
          fill="#1d1f1c"
          fill-opacity=".45"
          stroke="#F9F5EF"
          stroke-opacity=".03"
          stroke-width="2"
        />
        <g stroke="#F9F5EF" stroke-opacity=".045" stroke-width="2" fill="none">
          <path d="M600 830 2617 -130" stroke-dasharray="10 22" />
          <path d="M3480 830 5497 -130" stroke-dasharray="5 26" />
        </g>
      </svg>

      <!-- LIFT DEL LOGO DE PÁGINA -->
      <svg class="plane plane--lift" viewBox="0 0 4200 700" aria-hidden="true">
        <defs>
          <radialGradient id="cLift" cx="390" cy="690" r="620" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#F9F5EF" stop-opacity=".062" />
            <stop offset=".45" stop-color="#F9F5EF" stop-opacity=".022" />
            <stop offset="1" stop-color="#F9F5EF" stop-opacity="0" />
          </radialGradient>
        </defs>
        <rect width="4200" height="700" fill="url(#cLift)" />
      </svg>

      <!-- BLOOM — centro (3761, 207) -->
      <svg class="plane plane--bloom" viewBox="0 0 4200 700" aria-hidden="true">
        <defs>
          <radialGradient id="cBloomOuter" cx="3761" cy="207" r="330" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#00D7CA" stop-opacity=".072" />
            <stop offset=".5" stop-color="#00D7CA" stop-opacity=".022" />
            <stop offset="1" stop-color="#00D7CA" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="cBloomMid" cx="3761" cy="207" r="134" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3CF0E2" stop-opacity=".15" />
            <stop offset="1" stop-color="#00D7CA" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="cBloomCore" cx="3761" cy="207" r="60" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#8FFBF0" stop-opacity=".3" />
            <stop offset="1" stop-color="#00D7CA" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="cFlare" x1="3489" y1="207" x2="4033" y2="207" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#00D7CA" stop-opacity="0" />
            <stop offset=".5" stop-color="#5FF3E7" stop-opacity=".13" />
            <stop offset="1" stop-color="#00D7CA" stop-opacity="0" />
          </linearGradient>
          <filter id="cFlareBlur" x="-20%" y="-400%" width="140%" height="900%">
            <feGaussianBlur stdDeviation="9" />
          </filter>
        </defs>
        <rect width="4200" height="700" fill="url(#cBloomOuter)" />
        <rect width="4200" height="700" fill="url(#cBloomMid)" />
        <rect width="4200" height="700" fill="url(#cBloomCore)" />
        <rect x="3489" y="203" width="544" height="8" fill="url(#cFlare)" filter="url(#cFlareBlur)" />
      </svg>

      <!-- PLANO DELANTERO -->
      <svg class="plane plane--near" viewBox="0 0 4200 700" aria-hidden="true">
        <polygon points="-400,830 300,830 1070,170 370,170" fill="#202220" />
        <polygon points="380,830 500,830 1270,170 1150,170" fill="#282a26" />
        <polygon points="4010,830 4230,830 5000,170 4780,170" fill="#1b1d1a" />
      </svg>

      <!-- CAMPO NÍTIDO -->
      <svg class="plane plane--marks" viewBox="0 0 4200 700" aria-hidden="true">
        <defs>
          <filter id="cDof0" x="-45%" y="-140%" width="190%" height="380%">
            <feGaussianBlur stdDeviation="7.5" />
          </filter>
          <filter id="cDof1" x="-45%" y="-140%" width="190%" height="380%">
            <feGaussianBlur stdDeviation="5.4" />
          </filter>
          <filter id="cDof2" x="-45%" y="-140%" width="190%" height="380%">
            <feGaussianBlur stdDeviation="3.9" />
          </filter>
          <filter id="cDof3" x="-45%" y="-140%" width="190%" height="380%">
            <feGaussianBlur stdDeviation="2.7" />
          </filter>
          <filter id="cDof4" x="-45%" y="-140%" width="190%" height="380%">
            <feGaussianBlur stdDeviation="1.65" />
          </filter>
          <filter id="cDof5" x="-45%" y="-140%" width="190%" height="380%">
            <feGaussianBlur stdDeviation="0.75" />
          </filter>
          <filter id="cForeground" x="-30%" y="-90%" width="160%" height="280%">
            <feGaussianBlur stdDeviation="56" />
          </filter>
          <linearGradient id="cLeaderSpec" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#C9FFF8" stop-opacity=".85" />
            <stop offset="1" stop-color="#C9FFF8" stop-opacity="0" />
          </linearGradient>
        </defs>

        <!-- Matrix superior izquierda -->
        <g fill="#F9F5EF" opacity=".038" transform="translate(120 180) scale(2.6)">
          <rect x="8" y="57" width="42" height="13" rx="6.5" />
          <rect x="29" y="39" width="42" height="13" rx="6.5" />
          <rect x="50" y="21" width="42" height="13" rx="6.5" />
          <rect x="71" y="3" width="42" height="13" rx="6.5" />
          <rect x="92" y="-15" width="42" height="13" rx="6.5" />
        </g>
        <g fill="#F9F5EF" opacity=".026" transform="translate(560 96) scale(1.7)">
          <rect x="8" y="57" width="42" height="13" rx="6.5" />
          <rect x="29" y="39" width="42" height="13" rx="6.5" />
          <rect x="50" y="21" width="42" height="13" rx="6.5" />
        </g>

        <!-- Frontier Crop -->
        <g fill="#F9F5EF" opacity=".024" transform="translate(3910 424) scale(14)">
          <rect x="8" y="57" width="42" height="13" rx="6.5" />
          <rect x="29" y="39" width="42" height="13" rx="6.5" />
        </g>

        <!-- Regla de ticks -->
        <g stroke="#F9F5EF" stroke-width="2" fill="none">
          <g stroke-opacity=".05">
            <path d="M196 0v11M312 0v11M428 0v11M660 0v11M776 0v11M892 0v11M1124 0v11M1240 0v11M1356 0v11M1588 0v11M1704 0v11M1820 0v11M2052 0v11M2168 0v11M2284 0v11M2516 0v11M2632 0v11M2748 0v11M2980 0v11M3096 0v11M3212 0v11M3444 0v11M3560 0v11M3676 0v11M3908 0v11" />
          </g>
          <g stroke-opacity=".09">
            <path d="M80 0v24M544 0v24M1008 0v24M1472 0v24M1936 0v24M2400 0v24M2864 0v24M3328 0v24M3792 0v24" />
          </g>
        </g>

        <!-- Carril izquierdo -->
        <path d="M940 176V524" stroke="#F9F5EF" stroke-opacity=".13" stroke-width="2.5" />

        <!-- Corchetes de esquina -->
        <g stroke="#F9F5EF" stroke-opacity=".1" stroke-width="2.5" fill="none">
          <path d="M80 122V80h42" />
          <path d="M4120 578v42h-42" />
        </g>

        <!-- Traza primaria: módulo 42:13 ×3, paso +63/−54 -->
        <g
          id="primary-trace"
          shape-rendering="geometricPrecision"
          data-module-width="126"
          data-module-height="39"
          data-step-x="63"
          data-step-y="-54"
        >
          <path
            d="M3323 566 3824 137"
            fill="none"
            stroke="#F9F5EF"
            stroke-opacity=".055"
            stroke-width="2.5"
            stroke-dasharray="8 20"
          />
          <rect class="trace-module" x="3320" y="512" width="126" height="39" rx="19.5" fill="#F9F5EF" opacity=".05" filter="url(#cDof0)" />
          <rect class="trace-module" x="3383" y="458" width="126" height="39" rx="19.5" fill="#F9F5EF" opacity=".062" filter="url(#cDof1)" />
          <rect class="trace-module" x="3446" y="404" width="126" height="39" rx="19.5" fill="#F9F5EF" opacity=".072" filter="url(#cDof2)" />
          <rect class="trace-module" x="3509" y="350" width="126" height="39" rx="19.5" fill="#F9F5EF" opacity=".086" filter="url(#cDof3)" />
          <rect class="trace-module" x="3572" y="296" width="126" height="39" rx="19.5" fill="#F9F5EF" opacity=".105" filter="url(#cDof4)" />
          <rect class="trace-module" x="3635" y="242" width="126" height="39" rx="19.5" fill="#F9F5EF" opacity=".14" filter="url(#cDof5)" />
          <rect class="trace-module trace-leader" x="3698" y="188" width="126" height="39" rx="19.5" fill="#00D7CA" />
        </g>

        <!-- Especular del líder -->
        <path
          d="M3726 190.4h70a1.5 1.5 0 0 1 0 3h-70a1.5 1.5 0 0 1 0-3Z"
          fill="url(#cLeaderSpec)"
          opacity=".9"
        />

        <!-- Mira de registro -->
        <g stroke="#F9F5EF" stroke-opacity=".2" stroke-width="2" fill="none">
          <path d="M3670 185v-24h24" />
          <path d="M3852 230v24h-24" />
        </g>

        <!-- Cruz de registro -->
        <g stroke="#F9F5EF" stroke-opacity=".09" stroke-width="2">
          <path d="M4046 566h26M4059 553v26" />
        </g>

        <!-- Cápsula de primer plano recortada -->
        <rect
          x="3040"
          y="662"
          width="700"
          height="216"
          rx="108"
          fill="#F9F5EF"
          opacity=".055"
          filter="url(#cForeground)"
        />
      </svg>

      <!-- TIPOGRAFÍA -->
      <section class="content">
        <p class="system-label">INPLUX / APPLIED SYSTEM 01</p>
        <h1 class="title">APPLIED FRONTIER.</h1>
        <p class="descriptor">
          <span>FÁBRICA DE SOFTWARE AGÉNTICA.</span>
          <span>LEGALTECH + GOBIERNO.</span>
          <span>SOLUCIONES A LA MEDIDA.</span>
        </p>
      </section>

      <p class="endmark">INPLUX.CO</p>

      <!-- GRANO -->
      <svg class="grain" viewBox="0 0 4200 700" aria-hidden="true" preserveAspectRatio="none">
        <defs>
          <filter id="cGrain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="17" stitchTiles="stitch" />
            <feColorMatrix
              type="matrix"
              values="0 0 0 0 0.5
                      0 0 0 0 0.5
                      0 0 0 0 0.5
                      0 0 0 1 0"
            />
          </filter>
        </defs>
        <rect width="4200" height="700" filter="url(#cGrain)" />
      </svg>

      <div class="edge-shade" aria-hidden="true"></div>

      <!-- PRUEBA -->
      <div class="proof-layer" aria-hidden="true">
        <div class="proof-shape proof-safe"></div>
        <div class="proof-shape proof-logo"></div>
        <div class="proof-label proof-label--safe">Zona esencial 2400 × 460</div>
        <div class="proof-label proof-label--logo">Logo de Página</div>
      </div>
    </main>
  </body>
</html>
